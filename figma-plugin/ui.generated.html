<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: #171717; color: #f4f4f4; font: 11px Inter, system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .identity { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 24px; height: 24px; border: 1px solid #424242; border-radius: 50%; object-fit: cover; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: -.2px; }
    .connection { width: 7px; height: 7px; border-radius: 50%; background: #777; box-shadow: 0 0 0 3px #242424; }
    .connection.online { background: #52d273; }
    .actions { display: flex; justify-content: center; gap: 7px; }
    .action { width: 66px; text-align: center; }
    button { display: grid; place-items: center; width: 52px; height: 48px; margin: 0 auto 6px; padding: 0; border: 1px solid #383838; border-radius: 10px; background: #252525; color: #f5f5f5; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
    button:hover { background: #303030; border-color: #565656; }
    button:active { transform: scale(.96); }
    button:disabled { cursor: default; opacity: .45; }
    button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .label { color: #bdbdbd; line-height: 1.15; }
    .progress { height: 3px; margin-top: 13px; overflow: hidden; border-radius: 2px; background: #292929; }
    #bar { width: 0; height: 100%; border-radius: inherit; background: #6c8cff; transition: width .2s ease; }
    #status { height: 26px; margin-top: 7px; overflow: hidden; color: #8f8f8f; line-height: 13px; text-align: center; }
    footer { margin-top: 2px; text-align: center; }
    footer button { display: inline; width: auto; height: auto; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; color: #666; font: 9px Inter, system-ui, sans-serif; }
    footer button:hover { background: none; color: #aaa; }
  </style>
</head>

  <div class="actions">
    <div class="action">
      <button id="send-frame" title="Enviar frame selecionado" aria-label="Enviar frame selecionado">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M13 8l4 4-4 4"/></svg>
      </button>
      <div class="label">Enviar frame</div>
    </div>
    <div class="action">
      <button id="send-layer" title="Enviar layer selecionada" aria-label="Enviar layer selecionada">
        <svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></svg>
      </button>
      <div class="label">Enviar layer</div>
    </div>
    <div class="action"><button id="link-media" title="Vincular vídeo original" aria-label="Vincular vídeo original"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg></button><div class="label">Vincular mídia</div></div>
  </div>
  <input id="media-file" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden>
  <div class="progress"><div id="bar"></div></div>
  <div id="status"></div>
  <footer><button id="author" type="button">By Bruno Jorri</button></footer>
  <script>
    const buttons = Array.from(document.querySelectorAll("button"));
    const status = document.getElementById("status");
    const bar = document.getElementById("bar");
    const connection = document.getElementById("connection");
    const bridgeUrl = "http://localhost:47831";
    let bridgeToken = "";
    let mediaTarget = null;

    function progress(value, message) {
      bar.style.width = Math.max(0, Math.min(100, value)) + "%";
      status.textContent = message;
    }
    function busy(value) { buttons.forEach((button) => button.disabled = value); }

    async function connect() {
      try {
        const response = await fetch(bridgeUrl + "/v1/session");
        if (!response.ok) throw new Error();
        bridgeToken = (await response.json()).token;
        connection.classList.add("online");
        status.textContent = "Pronto para enviar";
        return true;
      } catch (_) {
        connection.classList.remove("online");
        status.textContent = "Ponte desconectada";
        return false;
      }
    }

    function begin(type, label) {
      busy(true);
      progress(3, "Preparando " + label + "…");
      parent.postMessage({ pluginMessage: { type } }, "*");
    }
    document.getElementById("send-frame").onclick = () => begin("export", "o frame");
    document.getElementById("send-layer").onclick = () => begin("export-layer", "a layer");
    document.getElementById("link-media").onclick = () => parent.postMessage({ pluginMessage: { type: "prepare-media-link" } }, "*");
    document.getElementById("author").onclick = () => parent.postMessage({ pluginMessage: { type: "open-instagram" } }, "*");

    window.onmessage = async (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === "progress") { progress(message.value, message.message); return; }
      if (message.type === "error") { busy(false); progress(0, message.message); return; }
      if (message.type === "media-link-target") { mediaTarget = message; document.getElementById("media-file").click(); return; }
      if (message.type === "media-link-complete") { busy(false); progress(100, "Mídia vinculada: " + message.name); return; }
      if (message.type !== "scene") return;
      progress(80, "Enviando…");
      if (!bridgeToken && !(await connect())) { busy(false); return; }
      try {
        const response = await fetch(bridgeUrl + "/v1/scene", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Bridge-Token": bridgeToken },
          body: JSON.stringify(message.scene)
        });
        progress(94, "Aguardando o After Effects…");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        progress(100, result.layerCount + " layers enviadas");
      } catch (error) {
        progress(0, "Falha: " + error.message);
      } finally {
        busy(false);
      }
    };
    document.getElementById("media-file").onchange = async (event) => {
      const file = event.target.files && event.target.files[0]; event.target.value = "";
      if (!file || !mediaTarget) return;
      busy(true); progress(15, "Vinculando mídia original…");
      try {
        if (!bridgeToken && !(await connect())) throw new Error("Ponte desconectada");
        const dimensions = await new Promise((resolve) => { const video = document.createElement("video"), url = URL.createObjectURL(file); video.onloadedmetadata = () => { const value = { width: video.videoWidth, height: video.videoHeight }; URL.revokeObjectURL(url); resolve(value); }; video.onerror = () => { URL.revokeObjectURL(url); resolve({ width: mediaTarget.width, height: mediaTarget.height }); }; video.src = url; });
        const response = await fetch(bridgeUrl + "/v1/media", { method: "POST", headers: { "Content-Type": "application/octet-stream", "X-Bridge-Token": bridgeToken, "X-Media-Id": mediaTarget.mediaKey, "X-File-Name": encodeURIComponent(file.name) }, body: file });
        const result = await response.json(); if (!response.ok) throw new Error(result.error || "Falha no upload local");
        parent.postMessage({ pluginMessage: { type: "media-linked", mediaKey: mediaTarget.mediaKey, name: mediaTarget.name, path: result.path, fileName: file.name, width: dimensions.width || mediaTarget.width, height: dimensions.height || mediaTarget.height } }, "*");
      } catch (error) { busy(false); progress(0, "Falha: " + error.message); }
    };
    connect();
  </script>
